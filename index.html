<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeLock AI — The World's First AI Music Assistant</title>
    <meta name="description" content="VibeLock AI finds any song even if you don't know its name. Search by lyrics, hum a melody, use voice, or describe your mood. AI-powered music intelligence." />
    <meta name="author" content="VibeLock AI" />
    <meta property="og:title" content="VibeLock AI — Find Any Song With AI" />
    <meta property="og:description" content="Hum a melody, type lyrics, or describe your mood. VibeLock AI instantly finds the perfect song." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VibeLock AI" />
    <meta name="twitter:description" content="The World's First AI Music Intelligence Assistant" />
    <!-- Google Fonts: Plus Jakarta Sans + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="display: none;"></div>
    <script type="text/javascript">
      // Clear Google Translate cookie on page load so it always starts in English
      (function() {
        var cookiesToClear = ['googtrans'];
        cookiesToClear.forEach(function(name) {
          document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
          document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=' + location.hostname;
          document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.' + location.hostname;
        });
      })();

      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'hi,mr,bn,ta,te,gu,kn,ml,pa,ur,or,en',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
